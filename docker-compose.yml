services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db-budget
      MYSQL_USER: budget
      MYSQL_PASSWORD: budget-pwd
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: budget
      DB_PASSWORD: budget-pwd
      DB_NAME: db-budget

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mysql_data:
